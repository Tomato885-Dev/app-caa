# ============================================================================
# PUBLICAR LA DEMOSTRACIÓN EN GITHUB PAGES
# ----------------------------------------------------------------------------
# Compila la app y la publica cada vez que se sube algo a la rama `main`.
#
# ⚠️ IMPORTANTE: compila con VITE_DEMO_ROSTER=true, es decir, con la nómina
# inventada. La nómina real de los alumnos NO entra en la página publicada.
# GitHub Pages es siempre público, así que esto no es negociable.
# ============================================================================
name: Publicar demostración

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compilar
        env:
          # Nómina inventada: sin datos de alumnos reales.
          VITE_DEMO_ROSTER: 'true'
          # La app se sirve desde /nombre-del-repositorio/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Conexión con Supabase.
          #
          # MIENTRAS ESTÉN VACÍOS, lo publicado es una DEMOSTRACIÓN: datos en el
          # navegador de cada visitante y cuentas de prueba a un clic. Es lo que
          # conviene para enseñarle la app a alguien sin darle una cuenta.
          #
          # AL DEFINIRLOS en Settings → Secrets, lo publicado pasa a ser la
          # aplicación REAL: contenido compartido y acceso solo con cuenta de la
          # nómina. Las cuentas de demostración desaparecen solas.
          #
          # La clave `anon` es pública a propósito: viaja dentro de la página en
          # cualquier caso. Lo que protege los datos son las reglas de acceso de
          # la base de datos, comprobadas ya: sin sesión no se lee nada.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Preparar navegación interna
        # GitHub Pages no sabe de rutas de aplicación: sin esto, entrar directo
        # a /proyectos o recargar la página daría 404. Servir el mismo index
        # como página de error deja que la app resuelva la ruta.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
