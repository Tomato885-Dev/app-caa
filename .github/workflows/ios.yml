# ============================================================================
# COMPILAR LA APP DE IPHONE
# ----------------------------------------------------------------------------
# Una app de iPhone solo se puede compilar en macOS. Nadie del equipo tiene un
# Mac, y arrendar uno cuesta dinero cada vez que haya que publicar una version
# nueva.
#
# GitHub presta maquinas Mac gratis a los repositorios publicos, y este archivo
# le dice a una de ellas que compile la aplicacion. Se lanza a mano desde la
# pestana Actions: no corre solo al subir codigo, porque cada ejecucion gasta
# varios minutos de una maquina prestada y no tiene sentido repetirla por un
# cambio de texto.
#
# QUE NECESITA
# Seis secretos en Settings -> Secrets and variables -> Actions. Cada uno esta
# descrito donde se usa. Sin ellos el trabajo falla al preparar la firma y no
# llega a tocar nada de Apple.
#
# DOS MODOS
#   solo-compilar    (por defecto)  Compila y deja el archivo para descargar.
#                                   No le manda nada a Apple. Sirve para
#                                   comprobar que todo funciona.
#   compilar-y-subir                Ademas lo entrega a App Store Connect, y
#                                   ahi queda listo para enviarlo a revision.
# ============================================================================

name: Compilar para App Store

on:
  workflow_dispatch:
    inputs:
      modo:
        description: Que hacer con la app compilada
        required: true
        default: solo-compilar
        type: choice
        options:
          - solo-compilar
          - compilar-y-subir

jobs:
  compilar:
    runs-on: macos-26
    timeout-minutes: 45

    env:
      EQUIPO: GB9YFP4L8M
      PAQUETE: cl.verbo.centroalumnos
      PERFIL: App CAA App Store

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v5

      # Apple exige compilar con un SDK reciente y rechaza el envio si no lo
      # es: "This app was built with the iOS 18.5 SDK". Las maquinas traen
      # varios Xcode instalados y el que viene elegido no siempre es el mas
      # nuevo, asi que se elige a mano el ultimo que haya.
      - name: Usar el Xcode mas nuevo
        run: |
          set -euo pipefail
          ULTIMO="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$ULTIMO"
          echo "Elegido: $ULTIMO"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Sin BASE_PATH a proposito: dentro del paquete la app vive en la raiz.
      # En GitHub Pages se compila con /app-caa/ delante, y esa carpeta aqui no
      # existe; con ella, la app abriria en blanco.
      - name: Compilar la aplicacion web
        env:
          # SIN ESTO LA APP NO SE CONECTA A NADA. Vite reemplaza estas
          # variables al compilar, y si llegan vacias `usingServer` queda en
          # falso: la aplicacion arranca en modo demostracion, con la nomina
          # inventada y los datos guardados en el propio telefono.
          #
          # Eso fue exactamente lo que se subio a Apple la primera vez. La app
          # abria bien y parecia correcta, pero ninguna cuenta real entraba,
          # porque la nomina de verdad vive en el servidor y la compilacion no
          # sabia donde estaba.
          #
          # La clave `anon` es publica a proposito: viaja dentro de la app de
          # todos modos. Lo que protege los datos son las reglas de acceso de
          # la base de datos.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Meter la web dentro del proyecto de iPhone
        run: npx cap sync ios

      - name: Instalar las dependencias de iOS
        working-directory: ios/App
        run: pod install --repo-update

      # --- Firma ------------------------------------------------------------
      # El certificado y el perfil viajan como texto en los secretos, porque un
      # secreto de GitHub no puede ser un archivo. Aqui vuelven a serlo.
      #
      # El llavero es temporal y muere con la maquina: cada ejecucion arranca de
      # cero y no queda nada guardado en ninguna parte.
      #
      #   IOS_CERTIFICADO_P12    el .p12 de distribucion, en base64
      #   IOS_CERTIFICADO_CLAVE  la contrasena de ese .p12
      #   IOS_PERFIL             el .mobileprovision, en base64
      - name: Preparar el certificado y el perfil
        env:
          CERTIFICADO: ${{ secrets.IOS_CERTIFICADO_P12 }}
          CLAVE_CERTIFICADO: ${{ secrets.IOS_CERTIFICADO_CLAVE }}
          PERFIL_B64: ${{ secrets.IOS_PERFIL }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/certificado.p12"
          PERF="$RUNNER_TEMP/perfil.mobileprovision"
          LLAVERO="$RUNNER_TEMP/firma.keychain-db"
          CLAVE_LLAVERO="$(uuidgen)"

          # Se descodifica con openssl y no con `base64`: el de macOS es el de
          # BSD y no entiende las opciones largas de GNU. El `tr` deja pasar
          # solo los caracteres validos de base64, por si el secreto quedo
          # pegado con saltos de linea o espacios de sobra.
          LIMPIO="A-Za-z0-9+/="
          printf '%s' "$CERTIFICADO" | tr -dc "$LIMPIO" | openssl base64 -d -A -out "$CERT"
          printf '%s' "$PERFIL_B64"  | tr -dc "$LIMPIO" | openssl base64 -d -A -out "$PERF"
          echo "Certificado: $(wc -c < "$CERT") bytes.  Perfil: $(wc -c < "$PERF") bytes."

          # Comprobaciones antes de tocar nada. Sin esto, un secreto mal pegado
          # o una contrasena equivocada fallan mas abajo con un mensaje de
          # macOS que no dice cual de las dos cosas fue.
          if [ ! -s "$CERT" ]; then
            echo "ERROR: el secreto IOS_CERTIFICADO_P12 llego vacio o no es base64."
            exit 1
          fi
          if [ ! -s "$PERF" ]; then
            echo "ERROR: el secreto IOS_PERFIL llego vacio o no es base64."
            exit 1
          fi
          if [ -z "${CLAVE_CERTIFICADO:-}" ]; then
            echo "ERROR: el secreto IOS_CERTIFICADO_CLAVE esta vacio."
            exit 1
          fi

          # `-legacy` no se pasa aqui a proposito: el openssl de macOS es
          # LibreSSL y esa opcion no existe; lee el formato antiguo de por si.
          REVISION="$(openssl pkcs12 -in "$CERT" -info -noout -passin pass:"$CLAVE_CERTIFICADO" 2>&1 || true)"
          if echo "$REVISION" | grep -qi "mac verify error"; then
            echo "ERROR: la contrasena de IOS_CERTIFICADO_CLAVE no abre el certificado."
            echo "Se rehace el .p12 o se corrige el secreto."
            exit 1
          fi
          if ! echo "$REVISION" | grep -qi "MAC:"; then
            echo "ERROR: IOS_CERTIFICADO_P12 no parece un certificado valido."
            echo "$REVISION"
            exit 1
          fi
          echo "El certificado se abre con la contrasena entregada."

          security create-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security set-keychain-settings -lut 21600 "$LLAVERO"
          security unlock-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security import "$CERT" -k "$LLAVERO" -P "$CLAVE_CERTIFICADO" -f pkcs12 -A \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CLAVE_LLAVERO" "$LLAVERO" > /dev/null
          security list-keychains -d user -s "$LLAVERO" $(security list-keychains -d user | sed 's/[" ]//g')

          # Deja constancia de que el certificado entro. Si esta linea no sale
          # en el registro, el problema es la contrasena del .p12.
          security find-identity -v -p codesigning "$LLAVERO"

          # Xcode busca los perfiles en dos carpetas distintas segun su version.
          # Se copia a las dos para no depender de cual traiga la maquina.
          security cms -D -i "$PERF" -o "$RUNNER_TEMP/perfil.plist"
          UUID="$(plutil -extract UUID raw "$RUNNER_TEMP/perfil.plist")"
          for destino in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                         "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$destino"
            cp "$PERF" "$destino/$UUID.mobileprovision"
          done

          echo "Firma lista. Perfil instalado con UUID $UUID"

      # --- Compilacion ------------------------------------------------------
      # El numero de compilacion sale del contador de ejecuciones de GitHub.
      # Apple exige que cada envio traiga uno distinto, y llevarlo a mano es la
      # forma mas facil de que un envio salga rechazado por repetido.
      - name: Archivar
        run: |
          set -euo pipefail
          # Los ajustes de firma NO se pasan por aqui: xcodebuild los aplicaria
          # a todos los objetivos, incluidas las librerias de Firebase y de
          # Capacitor, y una libreria no lleva perfil de firma. Viven dentro del
          # proyecto, en la configuracion Release de la app, y solo ahi.
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Preparar las opciones de exportacion
        run: |
          set -euo pipefail
          if [ "${{ inputs.modo }}" = "compilar-y-subir" ]; then
            DESTINO=upload
          else
            DESTINO=export
          fi

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>method</key><string>app-store</string>'
            echo "  <key>destination</key><string>$DESTINO</string>"
            echo "  <key>teamID</key><string>$EQUIPO</string>"
            echo '  <key>signingStyle</key><string>manual</string>'
            echo '  <key>uploadSymbols</key><true/>'
            echo '  <key>provisioningProfiles</key>'
            echo '  <dict>'
            echo "    <key>$PAQUETE</key><string>$PERFIL</string>"
            echo '  </dict>'
            echo '</dict>'
            echo '</plist>'
          } > "$RUNNER_TEMP/opciones.plist"

          plutil -lint "$RUNNER_TEMP/opciones.plist"
          echo "Modo: ${{ inputs.modo }}  (destination=$DESTINO)"

      # La llave de App Store Connect solo hace falta para subir, pero se pasa
      # siempre: xcodebuild la ignora cuando el destino es export.
      #
      #   APPSTORE_API_LLAVE   el contenido del AuthKey_XXXXXXXXXX.p8
      #   APPSTORE_KEY_ID      el identificador de esa llave
      #   APPSTORE_ISSUER_ID   el identificador del emisor, con guiones
      - name: Exportar la app
        env:
          LLAVE: ${{ secrets.APPSTORE_API_LLAVE }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$LLAVE" > "$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/opciones.plist" \
            -exportPath "$RUNNER_TEMP/salida" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          # Cuando la app se entrega directamente a Apple no queda carpeta
          # local, y listarla hacia fallar el paso despues de haber subido bien.
          if [ -d "$RUNNER_TEMP/salida" ]; then
            ls -la "$RUNNER_TEMP/salida"
          else
            echo "Sin archivo local: la app se entrego directamente a App Store Connect."
          fi

      - name: Guardar el archivo compilado
        if: inputs.modo == 'solo-compilar'
        uses: actions/upload-artifact@v4
        with:
          name: app-caa-iphone
          path: ${{ runner.temp }}/salida/*.ipa
          if-no-files-found: error
          retention-days: 14
